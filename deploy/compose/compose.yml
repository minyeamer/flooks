name: flooks

services:
  metadata-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - metadata-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    entrypoint: ["/app/migrate"]
    environment:
      METADATA_DATABASE_URL: ${METADATA_DATABASE_URL:?METADATA_DATABASE_URL must be set}
    depends_on:
      metadata-postgres: {condition: service_healthy}
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      HTTP_ADDR: :5741
      METADATA_DATABASE_URL: ${METADATA_DATABASE_URL:?METADATA_DATABASE_URL must be set}
      ANALYTICS_DATABASE_URL: ${ANALYTICS_DATABASE_URL:?ANALYTICS_DATABASE_URL must be set}
      REDIS_ADDR: ${REDIS_ADDR:?REDIS_ADDR must be set}
      DATASET_MANIFEST_DIR: /app/contracts/datasets
    ports: ["5741:5741"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5741/api/v1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
    stop_grace_period: 15s

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    ports: ["5740:5740"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5740/"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  metadata-data:
